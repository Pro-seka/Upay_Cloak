# Shared lint config for both backend parts ("ruff-clean" means: `ruff check backend tests` passes).
line-length = 120
target-version = "py310"
extend-exclude = ["ml", "scripts"]   # Person A's code is out of scope

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]                     # FastAPI's Depends(...) in defaults is idiomatic

[lint.isort]
known-first-party = ["backend", "ml", "scripts"]
