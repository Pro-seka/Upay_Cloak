<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel=stylesheet><link rel=stylesheet href="assets/css/style.css"><title>Dashboard · Trust Radar</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script></head><body><main id=main>
<h1>Risk overview</h1><p class=sub>Every alert answers: what happened, why it is risky, what to do next.</p>
<div class="grid g6" id=kpis></div>
<div class="grid g2" style="margin-top:16px"><section class=card><div class=head><h2 style="margin:0;margin-right:auto">Live transactions</h2><select id=fr aria-label="Risk filter"><option value=all>All risk levels<option value=critical>Critical<option value=high>High<option value=medium>Medium<option value=low>Low</select></div>
<table><thead><tr><th>Time<th>Type<th>Amount<th>Sender → Receiver<th>Risk<th>Decision<tbody id=feed></table></section>
<section class=card><h2>Risk levels</h2><canvas id=c1 height=200></canvas></section></div>
<div class="grid g3" style="margin-top:16px"><section class=card><h2>Alerts over time</h2><canvas id=c2 height=170></canvas></section>
<section class=card><h2>Top risk reasons</h2><canvas id=c3 height=170></canvas></section>
<section class=card><h2>Agents vs peers</h2><div id=agents></div></section></div>
<section class=card id=queue style="margin-top:16px"><div class=head><h2 style="margin:0;margin-right:auto">Alert queue</h2><select id=fa aria-label="Alert type"><option value="">All alert types<option value=account_takeover>Account takeover<option value=mule_network>Mule network<option value=scam>Scam<option value=agent_anomaly>Agent anomaly</select></div><div id=q></div></section>
</main><script src="assets/js/utils.js"></script><script src="assets/js/data.js"></script><script src="assets/js/api.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/dashboard.js"></script></body></html>
